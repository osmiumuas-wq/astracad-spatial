<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="AstraCAD Spatial: measure a real object with your bare hands and get a verified, printable part that fits it." />
    <meta name="theme-color" content="#070b14" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1220' stroke='%2335d0ff' stroke-width='2'/%3E%3Cpath d='M9 22 16 8l7 14' fill='none' stroke='%23ffb020' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>AstraCAD Spatial</title>
    <style>
      :root {
        --ink: #070b14;
        --panel: rgba(11, 18, 32, 0.86);
        --line: #24324a;
        --text: #f2f6fb;
        --dim: #9fb0c5;
        --cyan: #35d0ff;
        --amber: #ffb020;
        --green: #3ddc84;
        --red: #ff4d4f;
        --violet: #9b7bff;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(120% 90% at 70% 35%, #16233b 0%, #0a1120 55%, var(--ink) 100%);
        color: var(--text);
        font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
      }
      #scene-container { position: fixed; inset: 0; }
      #scene-container canvas { display: block; touch-action: none; }
      #flat {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: min(400px, 100vw);
        overflow-y: auto;
        padding: 22px 20px 28px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      #flat[hidden], #toast[hidden] { display: none; }
      .eyebrow { color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: 0.16em; }
      h1 { margin: 6px 0 8px; font-size: 25px; line-height: 1.2; letter-spacing: -0.01em; }
      h2 { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
      h3 { margin: 2px 0 4px; font-size: 16px; }
      p { margin: 0 0 8px; }
      .lede { color: var(--dim); }
      .hint, .note { color: var(--dim); font-size: 12.5px; }
      section { padding: 16px 0 6px; border-top: 1px solid var(--line); margin-top: 14px; }
      footer { margin-top: 18px; }
      button, select, input[type='text'] {
        font: inherit; color: var(--text);
        background: #14203a; border: 1px solid #2b3a57; border-radius: 10px;
        padding: 9px 12px; min-height: 40px;
      }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--cyan); }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary {
        width: 100%; min-height: 52px; margin: 6px 0 8px;
        background: linear-gradient(180deg, #ffc247, var(--amber)); border-color: #ffd06b;
        color: #1a1203; font-weight: 700; font-size: 17px;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .chips button.on { background: var(--cyan); border-color: var(--cyan); color: #04121c; font-weight: 700; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
      .row button { flex: 1 1 auto; }
      .field { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .field span { flex: 0 0 96px; color: var(--dim); }
      .field select, .field input { flex: 1; }
      .params { display: grid; gap: 8px; }
      .param {
        display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
        padding: 8px 10px; border: 1px solid transparent; border-radius: 10px;
      }
      .param.on { border-color: var(--amber); background: rgba(255, 176, 32, 0.07); }
      .param .name em { color: var(--cyan); font-style: normal; font-size: 12px; }
      .param output { font-variant-numeric: tabular-nums; font-weight: 600; }
      .param input { grid-column: 1 / -1; width: 100%; accent-color: var(--amber); min-height: 28px; }
      input[type='range'] { accent-color: var(--amber); }
      .verdict { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; margin-bottom: 8px; }
      .verdict.verified { border-color: var(--green); background: rgba(61, 220, 132, 0.12); }
      .verdict.kernel-only, .verdict.rolled { border-color: var(--amber); background: rgba(255, 176, 32, 0.1); }
      .verdict.refused { border-color: var(--red); background: rgba(255, 77, 79, 0.12); }
      .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      .checks li { display: grid; gap: 1px; padding-left: 14px; border-left: 3px solid var(--line); font-size: 13px; }
      .checks li.pass { border-color: var(--green); }
      .checks li.fail { border-color: var(--red); }
      .checks li.na { border-color: var(--amber); }
      .checks li span { color: var(--dim); font-variant-numeric: tabular-nums; }
      .agents { display: grid; gap: 10px; }
      .agent { padding: 12px; border-radius: 12px; border: 1px solid var(--line); border-left-width: 4px; background: rgba(20, 32, 58, 0.5); }
      .agent.ok { border-left-color: var(--green); }
      .agent.info { border-left-color: var(--cyan); }
      .agent.warn { border-left-color: var(--amber); }
      .agent.fail { border-left-color: var(--red); }
      .agent .who { font-size: 12px; color: var(--dim); letter-spacing: 0.04em; }
      .agent button { width: 100%; margin: 4px 0; border-color: var(--amber); }
      .log { margin: 6px 0 0; padding-left: 20px; color: var(--dim); font-size: 13px; }
      .share { display: flex; gap: 12px; align-items: flex-start; }
      .share input { width: 100%; font-size: 12px; }
      .qr { width: 132px; height: 132px; border-radius: 8px; flex: 0 0 auto; image-rendering: pixelated; }
      .shelf { display: grid; gap: 6px; }
      .saved { display: flex; gap: 6px; }
      .saved .load { flex: 1; display: grid; text-align: left; }
      .saved .load span { color: var(--dim); font-size: 12.5px; }
      .saved .remove { flex: 0 0 40px; }
      #toast {
        position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
        max-width: min(560px, 92vw); padding: 12px 16px; border-radius: 12px;
        background: #101a2e; border: 1px solid var(--line); opacity: 0;
        transition: opacity 0.2s, transform 0.2s; pointer-events: none;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #toast.good { border-color: var(--green); }
      #toast.warn { border-color: var(--amber); }
      #toast.bad { border-color: var(--red); }
      @media (max-width: 760px) {
        #flat { top: auto; height: 56vh; width: 100vw; border-right: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; }
      }
      @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
